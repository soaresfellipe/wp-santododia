name: Droid Auto Review

# Revisão automática de PR pelo Factory Droid.
# Requer o secret FACTORY_API_KEY e o app Factory Droid instalado no repositório.
# PRs de fork não recebem secrets no evento pull_request, então o job é pulado para eles.
# Não troque para pull_request_target: isso exporia a chave a código de terceiros.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: Factory-AI/droid-action@v9
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          # Modelo open-weight de nível rápido; o review de segurança usa o mesmo (fallback).
          review_model: oss-latest-fast
          automatic_security_review: true
          allowed_bots: "dependabot,factory-droid"
