name: Semgrep

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 14 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Análise (PHP e WordPress)
        run: semgrep scan --config p/php --config p/phpcs-security-audit --config p/secrets --sarif --output semgrep.sarif --error --exclude vendor --exclude tests

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
